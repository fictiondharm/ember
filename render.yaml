# render.yaml — Render Infrastructure as Code for FleetGrid
# https://render.com/docs/blueprint-spec
#
# HOW TO DEPLOY ON RENDER:
#   1. Go to https://dashboard.render.com
#   2. Click "New +" → "Blueprint"
#   3. Select your repository (fictiondharm/ember) and branch (feature/dodo-payments)
#   4. Click "Apply" — Render will automatically build and deploy:
#      - fleetgrid-app: The Full-Stack Node Web App (UI + Google Maps + API + WebSockets)
#      - fleetgrid-backend: Python FastAPI backend (optional)
#      - fleetgrid-db: PostgreSQL database (optional)

services:
  # ── 1. FleetGrid Full-Stack Production App (React + Express + WebSockets) ──
  - type: web
    name: fleetgrid-app
    runtime: node
    plan: free
    rootDir: .
    buildCommand: npm --prefix fleetgrid/web install && npm --prefix fleetgrid/web run build && npm --prefix fleetgrid/server install && npm --prefix fleetgrid/server run build
    startCommand: cd fleetgrid/server && npm run serve
    healthCheckPath: /api
    autoDeploy: true

    envVars:
      - key: NODE_VERSION
        value: 20
      - key: PORT
        value: 10000
      - key: HOST
        value: 0.0.0.0
      - key: CORS_ORIGIN
        value: "*"
      - key: DODO_PAYMENTS_API_KEY
        value: eycvR8WiFnjTz5kf.2UAFe13_adPZgyT1nMiVGpL9xIyGgMvmJr2HILpCyayyclCN
      - key: DODO_ENVIRONMENT
        value: live_mode
      - key: ELEVENLABS_API_KEY
        sync: false
      - key: ELEVENLABS_VOICE_ID
        value: 21m00Tcm4TlvDq8ikWAM

  # ── 2. FleetGrid Python Backend (FastAPI + GPS Simulations) ──────────────
  - type: web
    name: fleetgrid-backend
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health

    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: fleetgrid-db
          property: connectionString
      - key: ENVIRONMENT
        value: production
      - key: CORS_ORIGINS
        value: "*"
      - key: DB_POOL_SIZE
        value: "3"
      - key: DB_MAX_OVERFLOW
        value: "6"
      - key: DODO_PAYMENTS_API_KEY
        value: eycvR8WiFnjTz5kf.2UAFe13_adPZgyT1nMiVGpL9xIyGgMvmJr2HILpCyayyclCN
      - key: DODO_ENVIRONMENT
        value: live_mode
      - key: ELEVENLABS_API_KEY
        sync: false
      - key: ELEVENLABS_VOICE_ID
        sync: false
      - key: ELEVENLABS_AGENT_ID
        sync: false
      - key: EVM_RPC_URL
        sync: false
      - key: EVM_PRIVATE_KEY
        sync: false
      - key: EVM_PROOF_CONTRACT_ADDRESS
        sync: false

databases:
  - name: fleetgrid-db
    plan: free
    databaseName: fleetgrid
    user: fleetgrid
